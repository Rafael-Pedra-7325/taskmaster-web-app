<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Dashboard Full Stack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>TaskMaster</h1>
            <p>Gerenciador de Projetos e Tarefas</p>
        </header>

        <main class="main-content">
            <section class="card form-section">
                <h2>Criar Nova Tarefa</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="title">Título</label>
                        <input type="text" id="title" required placeholder="Ex: Desenvolver API REST">
                    </div>
                    <div class="form-group">
                        <label for="description">Descrição</label>
                        <textarea id="description" placeholder="Detalhes da tarefa..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="priority">Prioridade</label>
                            <select id="priority">
                                <option value="Baixa">Baixa</option>
                                <option value="Média" selected>Média</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status">
                                <option value="Pendente">Pendente</option>
                                <option value="Em Andamento">Em Andamento</option>
                                <option value="Concluído">Concluído</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary">Adicionar Tarefa</button>
                </form>
            </section>

            <section class="card tasks-section">
                <h2>Suas Tarefas</h2>
                <div id="task-list" class="task-grid">
                    <!-- Cards de tarefas serão renderizados via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
